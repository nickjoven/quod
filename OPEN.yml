- id: Q-21
  severity: medium
  status: open (reframed by SEMANTICS.md: the registry locks ARE the demonstranda; anchoring is a descriptor of their worth, not a gate; six wrappers remain un-anchored to Mathlib names because Mathlib has none)
  title: registry locks are locks on a name; the content lives in one custom constant
  detail: >
    Import found each clay_prize_* type is a single custom Prop
    (ClayRiemannHypothesis, ClayNavierStokes, ...; ClayPVersusNPResolution
    is a Type and its declaration a def). The lock therefore pins a name,
    and statement fidelity is entirely the anchor's job. Until each Clay
    wrapper is anchored by a checked Iff to a Mathlib-level statement (or,
    where Mathlib has none, to a wrapper whose own constants bottom out in
    Mathlib), "discharges the registry lock" means "proves a name". The
    registry's own docs claim such equivalences (e.g. ClayRiemannHypothesis
    to Mathlib's RiemannHypothesis); those theorems, if present, are the
    first anchor nominations and must pass anchor_check like any other.
  survey: >
    2026-09-06 closure.py at the registry pin: all seven wrappers GROUNDED
    (definitional closure ends in Mathlib; no axioms, opaque, or sorry in
    any definition; Yang-Mills' wrapper does not reach PhysLean). Custom
    constants in closure: PvsNP 22 (+ the resolution inductive), Riemann 5,
    Navier-Stokes 60, Hodge 31, BSD 12, Yang-Mills 10, Poincare 6. Only
    Riemann has an Iff to a Mathlib-NAMED statement (anchored via
    iff_real_part + RealPart.iff_mathlib). The other six cannot be
    Iff-anchored at this pin because Mathlib has no named statement for
    them; their fidelity rests on the registry's definitions (grounded)
    plus human/sieve review of those definitions (Q-5).
- id: Q-22
  severity: high
  status: closed 2026-09-06 dissolved by SEMANTICS.md (owner: "proof requires demonstrandum"): proven = the demonstrandum's lock is discharged; grounded/anchored are descriptors of the demonstrandum and never gate status; "counts against a Millennium problem" is the registry lock relation
  title: what "anchored" must mean for proven
  detail: >
    Two computed properties now exist per custom constant. ANCHORED: a
    checked Iff/Eq chain to a Mathlib-named declaration (strong fidelity;
    available for Riemann only among the seven). GROUNDED: the
    definitional closure ends in the pinned libraries with nothing hidden
    (available for all seven, and also for the induction-template control's private
    predicate, which is a grounded def). The status rule today caps a
    claim at `stated` unless every custom constant is ANCHORED, which
    leaves six Millennium problems unreachable by any proof at this pin.
  options: >
    A (current): keep the Iff rule; six problems dead at this pin.
    B (recommended): `proven` requires GROUNDED for every custom constant;
    ANCHORED is recorded as a separate fidelity field; "counts against a
    Millennium problem" stays a lock relation (registry_match, or a
    checked Iff to a registry lock). Consequence: the induction-template control N1
    computes `proven` as the implication it is, with `step` listed under
    hypotheses and registry_match none; the mismatch is then caught by the
    lock relation and the generated label (Q-5), not by a status. N1's
    calibration requirement changes accordingly and Q-1 gets its rule
    (conditional = proven with explicit Prop hypotheses that name claim
    ids or are not discharged).
