- id: Q-1
  severity: high
  status: closed 2026-09-06 by SEMANTICS.md: hypotheses are part of the lock and are listed as a descriptor; `conditional` removed from the lattice; a D with hypotheses is proven as the implication it is
  title: hypotheses are not machine-extracted; `conditional` is never computed
  detail: >
    The status table promises `conditional` for sorry-free proofs whose
    premises are named claims or undischarged hypotheses, and the claim
    schema has a `hypotheses:` field. Neither is implemented. The
    hypothesis-deletion mutant list is hand-typed per control (P1 only).
    A theorem `(step : ...) : ...` over Mathlib-only constants computes
    `proven` with the premise silently inside the lock (the lock is honest;
    the label is not, see Q-5).
  fix: extract binders from the elaborated type; generate one deletion mutant
    per explicit hypothesis; list premises in the claim; `conditional` when any
    premise names a claim id or is not an instance/typeclass binder.
