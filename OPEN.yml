- id: Q-25
  severity: medium
  status: open
  title: exit condition 6 (proposals attempted as `A ↔ B`) is vacuous over theorem pairs
  detail: >
    lemma's S5 proposals (L-5) pair two Mathlib THEOREMS A, B, both proven at
    the pin. Any two proven closed propositions are equivalent — `⟨fun _ => B,
    fun _ => A⟩` discharges `A ↔ B` — and the same holds pointwise under shared
    binders (`∀ xs, P xs ↔ Q xs`, since both P xs and Q xs hold). The self-proof
    gate (exit condition 2) cannot catch this: the Iff has its own lock, and A
    and B are legitimately usable constants. "Discharged" would measure the
    ladder finding two existing proofs, not an equivalence. Missed in design
    review (ATTEMPTS.md rev 2 exit condition 6; lemma docs/prover-loop.md).
    Found 2026-09-11 while preparing the attempt form; nothing was run.
  fix: >
    Pending the user's call (doctrine change). Proposals must pair
    propositions whose truth is NOT already established: the sides of
    Mathlib Iff theorems (corpus fields iff_lhs / iff_rhs; the pairs S5 was
    trained on), Prop-valued definitions, or hypotheses. The demonstrandum for
    sides L_i, L_j drawn from different Iff theorems with α-equivalent binder
    telescopes is `∀ xs, L_i xs ↔ L_j xs`; a discharge is a new fact even when
    it chains through the source Iffs (record the used constants as a
    difficulty feature, do not exclude them). lemma's proposal generator and
    the L-5 rerank move to that pool; until then exit condition 6 is blocked
    and no `A ↔ B` run is made.
- id: Q-26
  severity: high
  status: open
  title: the P-setting protocol (decision 2) froze P from a pilot drawn from an easier frame than the test
  detail: >
    Exit condition 1 failed twice, for different provers, in the same
    direction: tier A test 0.25 vs frozen 0.32, tier B test 0.685 vs frozen
    0.74. Diagnostic sealed as attempts/pilot-frame-diagnostic.json (CID
    3b527442...), from the DAG table (cbd1c771...) and the corpus: the
    50-theorem pilot is shallower than the 200-theorem test (median proof-DAG
    depth 10.5 vs 16; 28% of the pilot in the corpus's shallowest depth
    quartile vs 18% of the test, 28% vs 35% in the deepest), its statements
    are shorter (median 30 vs 34 tokens), and tier-A acceptance falls with
    depth (test: 47% in the shallowest quartile, 8.6% in the deepest).
    Mann-Whitney on depth z = -1.64 (suggestive at n = 50, which is the
    point). Both control sets were nominated by seeded hash order over all
    theorems (controls.py), so the pilot was not drawn from the test frame,
    and P was frozen at a point estimate of a 50-draw. The prover was not
    the cause; the protocol was.
  fix: >
    Decision 2 AMENDED for every future prover config (ATTEMPTS.md, amendment
    A1, carried on attempts-impl): (1) define the test frame first (200 or
    more, sealed by CID), then draw the pilot as a seeded random subsample of
    that frame, stratified by proof-DAG depth quartile so the difficulty mix
    matches; (2) freeze P at the LOWER bound of an 80% binomial (Wilson)
    confidence interval on the pilot estimate and record both numbers (for
    the record, that bound would have been 0.2423 for tier A's 16/50 and 0.6538
    for tier B's 37/50, against test rates 0.25 and 0.685); (3) frozen P and
    the pilot draw go into the manifest before the test runs, as now; (4) the
    existing frozen values 0.32 (tier A) and 0.74 (tier B) stay on record with
    their failures, never re-frozen; any funded rerun is a NEW prover config
    (same code, new manifest) under the amended protocol. controls.py gains
    --frame/--stratify for the draw. Also recorded here: pilot-B-neg (0/50
    accepted, 40/50 responses without a script, manifest 78bf9c3c...) is the
    first sealed evidence that the tier B prover declines false statements;
    the adversarial sweep (item 8) cites it.

- id: Q-27
  severity: medium
  status: fix-pending (runner edits on main 2026-09-16; first run under them is pilot-L2)
  title: the Goedel completion template and quod's closed-∀ demonstrandum disagree about binders
  detail: >
    Goedel-Prover-V2 was trained on `theorem name (binders) : body := by`, with
    the binders in the signature. attempt_b.py --prompt-style goedel presents
    the demonstrandum as `theorem X : ∀ {α} [inst : C α] (a : α), body := by`,
    so the model re-introduces the signature it expects to see, verbatim:
    `intro {α} {β} inst a b s`, `intro {B : Type u₁} [inst : Bicategory B] ...`.
    Lean parses `{α}` there as structure-instance notation and the script dies
    at step 0 ("invalid {...} notation, expected type is not of the form (C
    ...)"). Observed in pilot-L (goedel-nocot) rounds 1-2: 13 of 56 proposals
    open with a brace or bracket binder group in the first intro line, 10 of
    them failing at step 0 for exactly this reason; a further 8 carry `sorry`
    in a `have` (an honest no-proof) and 2 cite `u₁` universe names copied from
    the statement's pp. The tier L pilot rate is therefore a lower bound on the
    model's capability under this presentation; the run continues unchanged
    (a runner is never edited in flight) and its record cites this item.
  fix: >
    Next tier L prover config (new manifest, same weights): present the
    demonstrandum in signature form when it opens with a ∀ telescope, i.e.
    `theorem X {α : Type u} [inst : C α] (a : α) : body := by`, and have the
    gate replay the extracted script after an `intro` of those same names
    (the walker already treats `intros` as an identity transition), so the
    model sees the form it was trained on and the record still attempts the
    closed demonstrandum. Universe names: print with pp.universes off for the
    prompt (the lock is unaffected; it is computed from pp.all separately). A
    mechanical first-line repair (strip braces, brackets and ascriptions from
    the intro line) is the cheaper alternative and must be recorded per
    attempt as a repair, not silently applied.

- id: Q-28
  severity: medium
  status: fix-pending (runner edits on main 2026-09-16; first run under them is pilot-L2)
  title: the walker accepts a script whose simp arguments failed to elaborate; only the batch build catches it
  detail: >
    AttemptWalk runs tactics under Term.withoutErrToSorry and rejects a proof
    term with metavariables or sorry, but a tactic's OWN error recovery is
    governed by the Tactic context's `recover` flag, which the walker leaves
    at its default (true). simp's argument elaborator (Lean 4.28
    Lean/Elab/Tactic/Simp.lean, elabSimpArgs: "if (← read).recover then go
    else Term.withoutErrToSorry go") therefore LOGS an unknown lemma name and
    continues with the remaining arguments; if the rest of the script closes
    the goal, the term is sorry-free and the walker records `accepted`. The
    per-round batch build then fails the module ("Unknown constant
    `OrderDual.le_def`", "Unknown constant `MonoidHom.toMonoidHom`", "Unknown
    constant `RingCat.mul_coe`") and the driver records the verdict
    `rejected: batch build failed`. The status is therefore right (the build
    is the authority; ATTEMPTS.md gates a proof on the module building), and
    the disagreement was found because the ledger records both stages. Seen
    in pilot-L: 8 attempts over 3 demonstranda (StarMonoidHom.coe_toMonoidHom,
    RingCat.Colimits.descFunLift.eq_6, Finset.Iic_toDual), and 1 in pilot-B2;
    none in the ladder runs, which do not use simp with lemma lists. The
    transitions corpus is the casualty: those 8 scripts contributed 24
    transition rows carrying on_accepted_path=true and
    attempt_outcome=accepted, and attempt_verdict is null there because the
    build verdict is never propagated back into the shards.
  fix: >
    (1) Walker: run every step with `Tactic.withoutRecover` (recover := false)
    so a logged elaboration error becomes a step failure, and additionally
    check Core.getMessageLog for errors after each step (belt and braces:
    other tactics recover on their own terms). (2) Driver: after the batch
    build, rewrite the round's transition rows for a build-rejected attempt
    with attempt_verdict="rejected: batch build failed" and
    on_accepted_path=false, and re-hash the shard. (3) lemma: until (2)
    lands, wire_quod_run.py treats a row whose attempt_verdict is null and
    whose attempt is not in the manifest's `accepted` map as NOT on an
    accepted path. Both (1) and (2) are runner edits: next prover config, not
    the runs in flight.

- id: Q-29
  severity: low
  status: open
  title: a record that carries its own `cid` hashes to something else; the convention is unstated
  detail: >
    attempts/pilot-frame-diagnostic.json cites `cid: 3b527442...`; the file's
    blake3 is da3c871f... A reader verifying the citation by hashing the file
    fails. Checked 2026-09-16: the CID resolves in the store, and the stored
    blob is exactly the file with the `cid` key removed (json.dumps indent=1),
    so the citation is sound under the convention "a record's cid is the CID
    of the record without its cid field" — which is nowhere written down and
    which verify_records.py does not check. Records that instead cite a
    separate manifest's CID (exit records, wired shards) are unaffected.
  fix: >
    State the convention in ARCHITECTURE.md (evidence section) and have
    verify_records.py verify it for every tracked JSON record with a top-level
    `cid`: strip the key, re-serialize with indent=1, hash, compare. Any
    record that fails is a defect of the ledger.
