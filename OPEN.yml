# Every known problem with the ledger, in view. Rule (2026-09-06): a gap
# that is known and unlisted is a defect of the ledger, not of the gap.
# status: open | fix-pending (code written, run not yet recorded) | closed <date> <how>
# severity: high = a status can be wrong or forged; medium = coverage gap;
#           low = cost, ergonomics, or by-design limit worth stating.
- id: Q-1
  severity: high
  status: open
  title: hypotheses are not machine-extracted; `conditional` is never computed
  detail: >
    The status table promises `conditional` for sorry-free proofs whose
    premises are named claims or undischarged hypotheses, and the claim
    schema has a `hypotheses:` field. Neither is implemented. The
    hypothesis-deletion mutant list is hand-typed per control (P1 only).
    A theorem `(step : ...) : ...` over Mathlib-only constants computes
    `proven` with the premise silently inside the lock (the lock is honest;
    the label is not, see Q-5).
  fix: extract binders from the elaborated type; generate one deletion mutant
    per explicit hypothesis; list premises in the claim; `conditional` when any
    premise names a claim id or is not an instance/typeclass binder.
- id: Q-2
  severity: medium
  status: open
  title: satisfiability witness is not run per claim
  detail: P1Anchors.lean carries one `example` at n := Fin 1 compiled with the
    module; the runner does not check a witness for any claim.
- id: Q-3
  severity: medium
  status: open
  title: source scan over the transitive module closure is not implemented
  detail: L0 describes a scan for sorry, axiom, native_decide, implemented_by,
    extern, unsafe, set_option outside Mathlib. The axiom gate catches the
    kernel-visible cases (sorryAx, ofReduceBool, user axioms); the scan is
    defense in depth and does not exist yet.
- id: Q-4
  severity: low
  status: open
  title: triviality detection covers only a head that unfolds to `True`
  detail: `1 = 1` or `True ∧ True` behind a grand name computes `proven`.
    The lock is honest; the exposure is the label (Q-5). Also, an anchor
    `c ↔ True` is admissible and would launder a private predicate into a
    trivial but `proven` claim; anchor_check should whnf the rhs too.
- id: Q-5
  severity: high
  status: open
  title: prose-versus-lock drift is unchecked
  detail: >
    `statement:` is free text written by the prover. This is exactly how
    "P vs NP" got attached to `True`. No sieve dimension reads the
    pretty-printed lock against the prose, and no second prover has
    reviewed any control's statement (decision 4 not yet wired).
  fix: generate `statement:` from the lock (pp type) and keep the human
    gloss in a separately labelled field; sieve dim "statement fidelity".
- id: Q-6
  severity: medium
  status: open
  title: hyp_mutant counts any compile failure as a kill
  detail: A deletion that breaks syntax elsewhere counts as killed. The
    textual `--delete` cannot reach binders introduced by `variable`.
- id: Q-7
  severity: low
  status: open
  title: lean4checker is run on the declaring module, not `--fresh` over the closure
  detail: Decision 2 makes it required for `proven`; the invocation should
    replay the whole environment of the pin once per landing.
- id: Q-8
  severity: high
  status: closed 2026-09-06 refute_check.py + control N8; calibration PASS 11/11 (recheck11.log)
  title: refuted_by was a nomination nothing verified
  detail: Any axiom-clean theorem under any name could mark any claim
    `refuted`. Same class as the anchor hole found this morning.
  fix: scripts/refute_check.py requires the nominated type to be ¬T with T's
    canonical form equal to the claim's; control N8 (forged refutation).
- id: Q-9
  severity: low
  status: open
  title: universe-polymorphic claims can only be refuted at the same universe binding
  detail: The refutation gate demands lock equality, so N4 had to be restated
    over `Type` for P2's `Fin 2` counterexample to count. A checked
    instantiation edge (`Type u` ↦ `Type`) would lift this.
- id: Q-10
  severity: high
  status: open
  title: claim files and RESULTS.json are unguarded plain files
  detail: A status can be typed by hand and nothing notices until a rerun.
    No LAW pin of the runner scripts, no append-only gate, no message gate.
  fix: port the proslambenomenos gates; `calibrate.py --check` recomputes
    and diffs against the recorded files; LAW pins scripts/*.py.
- id: Q-11
  severity: medium
  status: open
  title: nominations live in calibrate.py source, not in claim files
  detail: ANCHORS, refuted_by, dedup_with, mutants are Python literals. They
    belong in the claim file as nominations the runner verifies.
- id: Q-12
  severity: medium
  status: open
  title: the corpus is blobs, not a graph
  detail: Only `ket put` is used. No statement/proof/verification nodes, no
    proves/anchors/refutes edges; the "corpus" is CIDs referenced from yml.
- id: Q-13
  severity: medium
  status: open
  title: runtime scales per check, not per module
  detail: 10 controls take 9m36s because every gate spawns a Lean process
    that imports Mathlib. Hundreds of claims need one Lean process per
    module running all checks.
- id: Q-14
  severity: low
  status: open
  title: second 7 GB Mathlib clone under calib/.lake
  detail: Lake path dependency resolution re-cloned Jin's Mathlib. Could be a
    symlink.
- id: Q-15
  severity: low
  status: open
  title: locks are pin-relative by construction
  detail: The canonical form is a pretty-printer string at one Lean/Mathlib
    version. Dedup across pins is impossible; decision 3 forbids cross-pin
    claims, so this is by design, but it must be said.
- id: Q-16
  severity: medium
  status: open
  title: every table the runner consults is a nomination
  detail: Anchors (fixed, N6/N7), refutations (fixed, N8), dedup targets (verified
    by lock equality), mutants (Q-1), checker module names (unverified: a
    wrong module name checks the wrong module).
- id: Q-17
  severity: low
  status: open
  title: no automated gate-off self-test
  detail: "Positive control fails when gate X is disabled" was done by hand
    once (anchors emptied). Should be a runner mode.
- id: Q-18
  severity: low
  status: closed 2026-09-06 verified against millennium/registry/lake-manifest.json (mathlib fabf563a7c, physlib 3dddd61e23, recorded in millennium/PIN.yml)
  title: the Millennium registry pin in ARCHITECTURE.md was written from memory
  detail: It said mathlib fabf563a. The registry clone at fd52071 must be
    read for its actual manifest revision before any lock is recorded.
- id: Q-19
  severity: medium
  status: open
  title: Millennium registry not yet imported
  detail: Clone at millennium/registry (fd52071, Lean v4.31.0). Needs cache,
    build at its own pin, seven clay_prize_* locks, claim files, and the
    same gates run on them (expected: seven `stated`, all custom constants
    listed and anchored or not).
- id: Q-20
  severity: medium
  status: open
  title: no lean4checker release matches the Millennium pin
  detail: The registry is on Lean v4.31.0; upstream lean4checker's newest tag
    is v4.29.0-rc8. The checker at millennium/lean4checker is master (91a7f0e)
    built with the toolchain overridden to v4.31.0; its bundled replay tests
    pass. Decision 2 makes the checker required for proven, so a proven
    at this pin rests on an unreleased checker build until upstream tags one.
- id: Q-21
  severity: high
  status: open
  title: registry locks are locks on a name; the content lives in one custom constant
  detail: >
    Import found each clay_prize_* type is a single custom Prop
    (ClayRiemannHypothesis, ClayNavierStokes, ...; ClayPVersusNPResolution
    is a Type and its declaration a def). The lock therefore pins a name,
    and statement fidelity is entirely the anchor's job. Until each Clay
    wrapper is anchored by a checked Iff to a Mathlib-level statement (or,
    where Mathlib has none, to a wrapper whose own constants bottom out in
    Mathlib), "discharges the registry lock" means "proves a name". The
    registry's own docs claim such equivalences (e.g. ClayRiemannHypothesis
    to Mathlib's RiemannHypothesis); those theorems, if present, are the
    first anchor nominations and must pass anchor_check like any other.
