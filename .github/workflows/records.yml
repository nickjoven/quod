name: records
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Verify the tracked records (claims, manifests, exit records, intake, calibration pins)
        run: python3 scripts/verify_records.py
      - name: Gate-logic tests (no Lean; every external gate is stubbed)
        run: python3 -m pytest -q tests
